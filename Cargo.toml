[package]
name = "kapsaro"
version.workspace = true
edition = "2021"
authors = ["Satoshi Ebisawa <ebisawa@gmail.com>"]
description = "Offline-first CLI for sharing encrypted .env files and other secrets through Git"
license = "Apache-2.0"
autotests = false

[workspace]
members = ["crates/kapsaro-core", "crates/kapsaro-test-support"]

[workspace.package]
version = "0.99.2-beta"

[workspace.dependencies]
kapsaro-core = { version = "0.99.2-beta", path = "crates/kapsaro-core", default-features = false }

# CI already runs clippy with -D warnings. Declaring the policy here applies the
# same strictness to local builds and editors.
#
# Production code contains no unsafe. Denying it here turns that from a property
# that happens to hold into one the build enforces; the few test helpers that
# need libc opt out explicitly.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_methods = "deny"

[lints]
workspace = true

[dependencies]
kapsaro-core = { workspace = true }

# CLI framework
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
time = "0.3"

# Secure memory handling
zeroize = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["online"]
online = ["kapsaro-core/online"]

[dev-dependencies]
kapsaro-core = { workspace = true, features = ["cli-test-support"] }
kapsaro-test-support = { path = "crates/kapsaro-test-support" }

# CLI testing
assert_cmd = "2"
predicates = "3"
libc = "0.2"
tempfile = "3"

# Serial test execution
serial_test = "3"

uuid = { version = "1", features = ["v4", "serde"] }

[[test]]
name = "cli_integration"
path = "tests/cli_integration.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Keep the default "unwind" strategy. Secret material is zeroized by Drop
# implementations, and "abort" would skip them on every panic path.
