[package]
name = "kapsaro-test-support"
version.workspace = true
edition = "2021"
authors = ["Satoshi Ebisawa <ebisawa@gmail.com>"]
description = "Shared test helpers for kapsaro workspace tests"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
kapsaro-core = { workspace = true, features = ["cli-test-support"] }
ed25519-dalek = "2"
tempfile = "3"
serde_json = "1"
time = "0.3"
